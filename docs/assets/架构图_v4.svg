<g font-size="18" text-anchor="middle"><text x="222" y="151">注册与登录 / 独立模拟账户</text><text x="600" y="151">工作台 / 知小行数字人</text><text x="978" y="151">运营指挥中心 / 领导与经理</text>
<text x="222" y="280">身份与请求网关</text><text x="600" y="280">知识问答与金融智能体</text><text x="978" y="280">运营服务与安全处置</text>
<text x="600" y="432" font-weight="700" fill="#165dce">MySQL InnoDB · 15张项目表 · 版本检查与事务提交</text>
<text x="222" y="572">设备与本机服务采集</text><text x="600" y="572">关联工单状态机</text><text x="978" y="572">脱敏数据可视化与导出</text></g>
<g font-size="13" text-anchor="middle" fill="#5f6f85"><text x="222" y="177">显式演示入口，与注册账户隔离</text><text x="600" y="177">自然语言 / 来源 / 跨页面任务恢复</text><text x="978" y="177">1920×1080 / 5秒刷新 / 按范围筛选</text>
<text x="222" y="309">scrypt / 会话摘要 / CSRF / 用户绑定</text><text x="222" y="330">空闲30分钟 / 绝对8小时 / 退出撤销</text>
<text x="600" y="309">本地知识或模型主题 / 30项固定工具</text><text x="600" y="330">NLU → DAG → 独立权限 → 执行与核验</text>
